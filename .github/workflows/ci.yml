name: Project Skripsi CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The initial archive bootstrap commit is intentionally not a testable source tree.
    # The full matrix runs on the subsequent expanded-source commit.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[bootstrap]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public source manifest (cross-platform)
        run: python scripts/verify_manifest.py
      - name: Install optional document QA dependencies
        run: python -m pip install "python-docx>=1.1" "PyMuPDF>=1.24" "jsonschema>=4.22"
      - name: Install LibreOffice for rendered document integration tests (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreoffice
      - name: Compile package
        run: python -m compileall -q src scripts tests
      - name: Validate reference research ledger
        run: python scripts/validate_phase_ledger.py
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Install editable package
        run: python -m pip install --no-deps -e .
      - name: CLI smoke test
        run: project-skripsi --help
