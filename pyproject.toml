[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-skripsi-engine"
version = "0.8.0"
description = "Local-first, evidence-driven thesis research, statistical, revision QA, Turnitin report comparison and document workspace engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Project Skripsi Maintainers" }]
dependencies = []

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
document-qa = ["PyMuPDF>=1.24"]
pdf-qa = ["PyMuPDF>=1.24"]
jsonschema = ["jsonschema>=4.22"]

[project.scripts]
project-skripsi = "project_skripsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
