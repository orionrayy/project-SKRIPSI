name: Project Skripsi CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The initial archive bootstrap commit is intentionally not a testable source tree.
    # The full matrix runs on the subsequent expanded-source commit.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[bootstrap]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve byte-exact checkout for manifest integrity
        shell: bash
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Diagnose exact source manifest hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          manifest = Path("MANIFEST.sha256").read_text(encoding="utf-8").splitlines()
          mismatches = 0
          for line in manifest:
              expected, relative = line.split("  ", 1)
              actual = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
              if actual != expected:
                  print(f"MISMATCH {relative} expected={expected} actual={actual}")
                  mismatches += 1
          print(f"MANIFEST_DIAGNOSTIC mismatches={mismatches} entries={len(manifest)}")
          PY
      - name: Verify public source manifest (cross-platform)
        run: python scripts/verify_manifest.py
      - name: Install optional document QA dependencies
        run: python -m pip install "python-docx>=1.1" "PyMuPDF>=1.24" "jsonschema>=4.22"
      - name: Install LibreOffice for rendered document integration tests (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreoffice
      # GitHub-hosted Windows runners can install LibreOffice but may deny process
      # creation (WinError 5). Rendering is exercised on Ubuntu; Windows skips
      # only tests guarded by PDF_RENDER_AVAILABLE when no renderer is installed.
      - name: Compile package
        run: python -m compileall -q src scripts tests
      - name: Validate reference research ledger
        run: python scripts/validate_phase_ledger.py
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Install editable package
        run: python -m pip install --no-deps -e .
      - name: CLI smoke test
        run: project-skripsi --help
